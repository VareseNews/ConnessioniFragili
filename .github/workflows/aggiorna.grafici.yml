name: Aggiorna grafici

on:
  schedule:
    - cron: "7 * * * *"   # ogni ora, al minuto 7 (fuori dall'ora tonda)
  workflow_dispatch:          # avvio manuale dal tab Actions
  push:
    branches: [ main ]
    paths:
      - "script/**"

permissions:
  contents: write

concurrency:
  group: aggiorna-grafici
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa la libreria di autenticazione Google
        run: pip install --quiet google-auth requests

      - name: Scarica le risposte dal foglio privato
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SHEET_GID: ${{ secrets.SHEET_GID }}
        # Il CSV resta nella cartella temporanea della macchina: non entra mai nel repository
        run: python3 script/fetch.py "$RUNNER_TEMP/risposte.csv"

      - name: Rigenera i grafici
        run: |
          python3 -I script/gen.py "$RUNNER_TEMP/risposte.csv" grafici
          python3 -I script/wc.py "$RUNNER_TEMP/risposte.csv" grafici

      - name: Cancella il CSV
        if: always()
        run: rm -f "$RUNNER_TEMP/risposte.csv"

      - name: Commit se ci sono novità
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain grafici)" ]; then
            git add grafici
            git commit -m "Aggiornamento grafici $(TZ=Europe/Rome date '+%Y-%m-%d %H:%M')"
            git push
          else
            echo "Nessuna variazione nei dati."
          fi
