  svg { display: block; width: 100%; height: auto; }
  svg text { font-family: "Roboto Slab", Rockwell, Georgia, serif; font-weight: 500; cursor: default; transition: opacity .12s; }
  svg:hover text { opacity: .45; }
  svg text:hover, svg text.on { opacity: 1; }
  .note { font-size: 11px; line-height: 1.5; color: var(--muted); border-top: 1px solid var(--rule); padding-top: 10px; margin: 8px 0 0; }
  .tip {
    position: absolute; pointer-events: none; z-index: 10;
    background: var(--ink); color: #fff; font-size: 12px; line-height: 1.4;
    padding: 7px 9px; border-radius: 4px; max-width: 240px;
    opacity: 0; transition: opacity .1s;
  }
  .sr { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
</style>

const W = 600, H = 420;

const fmt = v => Math.round(v).toLocaleString("it-IT") + "%";
document.getElementById("title").textContent = SPEC.title;
document.getElementById("sub").textContent = SPEC.sub;
document.getElementById("note").textContent = SPEC.note + (SPEC.updated ? " " + SPEC.updated : "");
document.getElementById("cloud").setAttribute("aria-label", "Nuvola di parole: " + SPEC.words.slice(0, 15).map(w => w.t).join(", "));
document.getElementById("sr-list").innerHTML = SPEC.words.map(w => `<li>${w.t}: ${fmt(w.p)} delle risposte</li>`).join("");

const tip = document.getElementById("tip");
function showTip(e, html) {
  tip.innerHTML = html;
  tip.style.opacity = 1;
  const r = tip.getBoundingClientRect();
  let x = e.pageX + 12, y = e.pageY - r.height - 10;
  if (x + r.width > document.documentElement.clientWidth - 4) x = e.pageX - r.width - 12;
  if (x < 4) x = 4;
  if (y < window.scrollY + 4) y = e.pageY + 16;
  tip.style.left = x + "px";
  tip.style.top = y + "px";
}
function hideTip() { tip.style.opacity = 0; }

// Generatore pseudo-casuale con seme fisso: la disposizione è sempre la stessa
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function draw() {
  const max = SPEC.words[0].p, min = SPEC.words[SPEC.words.length - 1].p;
  const size = p => 13 + (52 - 13) * Math.sqrt((p - min) / (max - min || 1));
  const color = i => i < 6 ? "var(--red)" : i < 24 ? "var(--gray)" : "var(--light)";
  const words = SPEC.words.map((w, i) => ({ text: w.t, p: w.p, size: size(w.p), fill: color(i) }));

  d3.layout.cloud()
    .size([W, H])
    .words(words)
    .padding(3)
    .rotate(0)
    .font("Roboto Slab")
    .fontWeight(500)
    .fontSize(d => d.size)
    .random(mulberry32(7))
    .spiral("archimedean")
    .on("end", placed => {
      const svg = document.getElementById("cloud");
      const NS = "http://www.w3.org/2000/svg";
      const g = document.createElementNS(NS, "g");
      g.setAttribute("transform", `translate(${W / 2},${H / 2})`);
      placed.forEach(d => {
        const t = document.createElementNS(NS, "text");
        t.setAttribute("text-anchor", "middle");
        t.setAttribute("transform", `translate(${d.x},${d.y})`);
        t.setAttribute("font-size", d.size);
        t.setAttribute("fill", d.fill);
        t.textContent = d.text;
        const html = `<b>${d.text}</b><br>compare nel ${fmt(d.p)} delle risposte`;
        t.addEventListener("mousemove", e => showTip(e, html));
        t.addEventListener("mouseleave", hideTip);
        t.addEventListener("touchstart", e => {
          svg.querySelectorAll("text").forEach(x => x.classList.remove("on"));
          t.classList.add("on");
          showTip(e.touches[0], html);
        }, { passive: true });
        g.appendChild(t);
      });
      svg.appendChild(g);
      svg.dataset.placed = placed.length;
      postHeight();
    })
    .start();
}
document.addEventListener("touchstart", e => { if (e.target.tagName !== "text") hideTip(); }, { passive: true });

// Aspetta il font, altrimenti le misure delle parole sono sbagliate
(document.fonts ? document.fonts.load('500 20px "Roboto Slab"').then(() => document.fonts.ready) : Promise.resolve()).then(draw, draw);

function postHeight() {
  const h = document.getElementById("chart").offsetHeight;
  if (window.parent !== window) window.parent.postMessage({ type: "embed-height", height: h }, "*");
}
